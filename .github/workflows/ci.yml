name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version-file: ".python-version"
          enable-cache: true
      - name: Install
        run: uv sync --all-groups --frozen
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Types
        run: uv run ty check src/
      - name: Tests
        run: uv run pytest --cov-report=xml
      - name: Audit
        # chromadb is a CrewAI transitive, pinned to 1.1.x. All four ignored CVEs
        # are Chroma HTTP-server auth/RBAC/trust_remote_code flaws; this app never
        # starts a Chroma server or exposes its API.
        run: >-
          uv run pip-audit . --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
